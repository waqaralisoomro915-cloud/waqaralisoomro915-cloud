name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animation from GitHub contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#65cfff&color_dots=#102438,#164e43,#218c6a,#30c78d,#47efb5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Frame and publish the activity panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import base64, datetime, json, os, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = "http://www.w3.org/2000/svg"
          ET.register_namespace("", ns)
          tag = lambda name: "{" + ns + "}" + name
          snake = ET.fromstring(Path("dist/snake.svg").read_text())
          box = [float(n) for n in snake.attrib["viewBox"].replace(",", " ").split()]
          graph_h = round(912 * box[3] / box[2])
          height = graph_h + 242
          cells = [e for e in snake.iter() if "c" in e.get("class", "").split()]
          active = sum(len(e.get("class", "").split()) > 1 for e in cells)
          panel = ET.Element(tag("svg"), {
              "width":"960", "height":str(height), "viewBox":f"0 0 960 {height}",
              "role":"img", "aria-labelledby":"panel-title panel-desc"
          })
          def add(name, attrs=None, text=None, parent=None):
              el = ET.SubElement(panel if parent is None else parent, tag(name), attrs or {})
              if text is not None:
                  el.text = text
              return el
          add("title", {"id":"panel-title"}, "Contribution Snake — arcade replay")
          add("desc", {"id":"panel-desc"}, "An arcade-style animated snake follows real GitHub contributions. " + str(active) + " active days in the generated calendar. Automatic replay, not an interactive game.")
          defs = add("defs")
          for ident, first, last in [("cabinet","#112b40","#030914"), ("snake-body","#b7f6ff","#1598e1"), ("screen","#030a12","#0b1c25")]:
              grad = add("linearGradient", {"id":ident, "x2":"0.8", "y2":"1"}, parent=defs)
              add("stop", {"stop-color":first}, parent=grad)
              add("stop", {"offset":"1","stop-color":last}, parent=grad)
          pattern = add("pattern", {"id":"scanlines","width":"4","height":"4","patternUnits":"userSpaceOnUse"}, parent=defs)
          add("path", {"d":"M0 1H4","stroke":"#000","stroke-opacity":".12"}, parent=pattern)
          add("style", text=".s{fill:url(#snake-body);stroke:#b5f4ff;stroke-width:.5px}.c{stroke:#2a5149;stroke-width:.7px}.lamp{animation:lamp 2s ease-in-out infinite}@keyframes lamp{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.s,.c,.u,.lamp{animation:none!important}}")
          add("rect", {"x":"4","y":"8","width":"952","height":str(height-9),"rx":"22","fill":"#010409"})
          add("rect", {"x":"1","y":"1","width":"958","height":str(height-10),"rx":"21","fill":"url(#cabinet)","stroke":"#36566f"})
          add("path", {"d":"M24 2H936","stroke":"#65cfff","stroke-opacity":".65"})
          def text(x,y,value,size=12,color="#8caec6",weight="400",anchor="start"):
              return add("text", {"x":str(x),"y":str(y),"font-family":"Consolas,monospace","font-size":str(size),"fill":color,"font-weight":weight,"text-anchor":anchor},value)
          text(28,32,"WAQAR / GITHUB ARCADE",11,"#47efb5")
          text(27,71,"CONTRIBUTION SNAKE",29,"#eef9ff","700")
          add("circle", {"cx":"815","cy":"28","r":"4","fill":"#47efb5","class":"lamp"})
          text(830,32,"AUTO REPLAY",11,"#47efb5")
          for x,label,value,color in [(28,"ACTIVE DAYS",str(active).zfill(3),"#47efb5"),(220,"CALENDAR CELLS",str(len(cells)),"#65cfff"),(439,"DATA SOURCE","GITHUB","#b4a5ff"),(691,"MODE","CONTRIBUTION REPLAY","#8ce6db")]:
              add("rect", {"x":str(x),"y":"88","width":"174" if x<439 else "232","height":"48","rx":"8","fill":"#06121e","stroke":"#28485d"})
              text(x+13,104,label,8)
              text(x+13,124,value,14,color,"700")
          add("rect", {"x":"16","y":"148","width":"928","height":str(graph_h+30),"rx":"12","fill":"#010608","stroke":"#386c6b","stroke-width":"2"})
          add("rect", {"x":"20","y":"152","width":"920","height":str(graph_h+22),"rx":"10","fill":"url(#screen)"})
          # Give each segment a rounded, dimensional body. The head and its eyes
          # share the generator's exact movement animation.
          head = next(e for e in list(snake) if e.get("class") == "s s0")
          position = list(snake).index(head)
          snake.remove(head)
          group = ET.Element(tag("g"), {"class":"s s0"})
          head.attrib.pop("class")
          head.set("fill","url(#snake-body)")
          group.append(head)
          for x in ("4.3","10.2"):
              add("circle", {"cx":x,"cy":"5.0","r":"2.1","fill":"#f6ffff","stroke":"none"}, parent=group)
              add("circle", {"cx":x,"cy":"4.6","r":"1.0","fill":"#022335","stroke":"none"}, parent=group)
          add("path", {"d":"M5 11Q8 13 11 11","fill":"none","stroke":"#075171","stroke-width":".8"}, parent=group)
          # Draw the head above the tail.
          snake.append(group)
          snake.set("x","24")
          snake.set("y","163")
          snake.set("width","912")
          snake.set("height",str(graph_h))
          panel.append(snake)
          add("rect", {"x":"20","y":"152","width":"920","height":str(graph_h+22),"rx":"10","fill":"url(#scanlines)","pointer-events":"none"})
          text(28,height-37,"COLLECT ACTIVITY  /  FOLLOW THE TRAIL  /  REPEAT",11,"#65cfff")
          text(28,height-18,"REAL CONTRIBUTION DATA · REFRESHED DAILY · ANIMATED REPLAY",8)
          text(930,height-18,datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d UTC"),9,anchor="end")
          data = ET.tostring(panel, encoding="utf-8", xml_declaration=True)
          endpoint = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/contents/assets/contribution-snake.svg"
          headers = {"Authorization":"Bearer " + os.environ["GH_TOKEN"],
                     "Accept":"application/vnd.github+json", "User-Agent":"profile-activity-workflow"}
          sha = None
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers)) as response:
                  sha = json.load(response)["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          payload = {"message":"Refresh contribution snake [skip ci]",
                     "content":base64.b64encode(data).decode(), "branch":"main"}
          if sha:
              payload["sha"] = sha
          request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(),
                                          headers={**headers, "Content-Type":"application/json"}, method="PUT")
          with urllib.request.urlopen(request) as response:
              result = json.load(response)
          print("Published activity panel:", result["content"]["path"])
