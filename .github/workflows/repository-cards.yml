name: Refresh repository cards
on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-cards.yml"
      - "scripts/update_repository_cards.py"
      - "scripts/card-overrides.json"
      - "scripts/repository-card.svg.template"
permissions:
  contents: write
concurrency:
  group: repository-cards
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Generate and validate public repository cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repository_cards.py
      - name: Publish changed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/cards/
          if git diff --cached --quiet; then
            echo "Repository cards are already current."
            exit 0
          fi
          git commit -m "Refresh public repository cards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
