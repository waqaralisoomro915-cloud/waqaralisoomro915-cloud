<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Waqar Ali — full-stack developer</title><desc id="desc">Building Django REST APIs and Next.js interfaces for personal finance and cash-on-delivery order verification. Engineering focus: business rules, authentication, data ownership, and frontend-backend integration.</desc>
