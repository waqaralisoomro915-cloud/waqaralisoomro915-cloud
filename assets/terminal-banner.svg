<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Waqar Ali — Full-stack developer</title><desc id="desc">Dark terminal banner with animated circuit paths and a blinking cursor. Python, Django, Next.js and TypeScript.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060c15"/><stop offset="1" stop-color="#0d1d29"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#38ef98"/><stop offset="1" stop-color="#38d7ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#15303d" stroke-width=".6"/></pattern>
</defs>
<style>
.cursor{animation:blink 1.2s steps(2,end) infinite}.flow{stroke-dasharray:12 280;animation:flow 9s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes blink{50%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-584}}@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.cursor,.flow,.pulse{animation:none}}
</style>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect width="1200" height="420" rx="20" fill="url(#grid)" opacity=".55"/>
<rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#23414e"/>
