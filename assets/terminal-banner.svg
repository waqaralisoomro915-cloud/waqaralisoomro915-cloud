<text x="55" y="187" font-size="64" font-weight="700" letter-spacing="-2" fill="#edf7ff">WAQAR ALI</text>
<text x="59" y="225" font-size="21" fill="#b4cbd8">Full-stack developer</text>
<rect x="59" y="251" width="365" height="3" rx="1.5" fill="url(#accent)"/>
