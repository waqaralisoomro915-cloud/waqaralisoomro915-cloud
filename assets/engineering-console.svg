<svg xmlns="http://www.w3.org/2000/svg" width="960" height="382" viewBox="0 0 960 382" role="img" aria-labelledby="title desc"><title id="title">Engineering interests</title><desc id="desc">Clear business rules and maintainable APIs. User and store isolation, validation and authentication. Usable interfaces for complex workflows. Tests and documentation that explain behavior.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091725"/><stop offset="1" stop-color="#040b14"/></linearGradient><linearGradient id="panel" x2=".8" y2="1"><stop stop-color="#122b3c"/><stop offset="1" stop-color="#0b1727"/></linearGradient><linearGradient id="neon"><stop stop-color="#48efbb"/><stop offset="1" stop-color="#65aaff"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#396379" opacity=".35"/></pattern></defs>
<style>.signal{stroke-dasharray:18 250;animation:flow 10s linear infinite}.ring{stroke-dasharray:19 100;animation:spin 9s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-536}}@keyframes spin{to{stroke-dashoffset:-238}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.signal,.ring,.pulse{animation:none}}</style><rect x="1" y="1" width="958" height="380" rx="20" fill="url(#bg)" stroke="#294457"/><rect x="1" y="1" width="958" height="380" rx="20" fill="url(#dots)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="26" y="32" font-size="11" letter-spacing="3" fill="#65cfff">ENGINEERING / PRINCIPLES</text><text x="24" y="66" font-size="27" font-weight="700" fill="#ecf7ff">How I approach the build.</text><g transform="translate(24 92)"><rect x="3" y="5" width="446" height="120" rx="12" fill="#02060b"/><rect width="446" height="120" rx="12" fill="url(#panel)" stroke="#29485c"/><path d="M15 1H431" stroke="#48efbb" opacity=".4"/><text x="20" y="27" fill="#48efbb" font-size="11" letter-spacing="1.6">01 / BUSINESS LOGIC</text><text x="20" y="60" fill="#ecf7ff" font-size="18" font-weight="600">Clear rules. Maintainable APIs.</text><text x="20" y="85" fill="#99b6ca" font-size="12">Services with focused responsibilities.</text><g transform="translate(395 18) scale(.75)" fill="none" stroke="#48efbb" stroke-width="1.5"><path d="M0 0h24v12H0ZM0 20h24v12H0ZM12 12v8"/></g><path d="M20 105H426" stroke="#223d52"/><path d="M20 105H426" stroke="#48efbb" stroke-opacity=".65" class="signal" style="animation-delay:-0s"/></g><g transform="translate(490 92)"><rect x="3" y="5" width="446" height="120" rx="12" fill="#02060b"/><rect width="446" height="120" rx="12" fill="url(#panel)" stroke="#29485c"/><path d="M15 1H431" stroke="#65cfff" opacity=".4"/><text x="20" y="27" fill="#65cfff" font-size="11" letter-spacing="1.6">02 / ACCESS + OWNERSHIP</text><text x="20" y="60" fill="#ecf7ff" font-size="18" font-weight="600">Scope data to the right user.</text><text x="20" y="85" fill="#99b6ca" font-size="12">Validation and predictable authentication.</text><g transform="translate(395 18) scale(.75)" fill="none" stroke="#65cfff" stroke-width="1.5"><path d="M12 0L26 6v12Q24 28 12 33Q0 28-2 18V6ZM5 15l5 5 10-12"/></g><path d="M20 105H426" stroke="#223d52"/><path d="M20 105H426" stroke="#65cfff" stroke-opacity=".65" class="signal" style="animation-delay:-2s"/></g><g transform="translate(24 230)"><rect x="3" y="5" width="446" height="120" rx="12" fill="#02060b"/><rect width="446" height="120" rx="12" fill="url(#panel)" stroke="#29485c"/><path d="M15 1H431" stroke="#b5a2ff" opacity=".4"/><text x="20" y="27" fill="#b5a2ff" font-size="11" letter-spacing="1.6">03 / USER EXPERIENCE</text><text x="20" y="60" fill="#ecf7ff" font-size="18" font-weight="600">Make complex workflows clear.</text><text x="20" y="85" fill="#99b6ca" font-size="12">Interfaces built around the task.</text><g transform="translate(395 18) scale(.75)" fill="none" stroke="#b5a2ff" stroke-width="1.5"><path d="M0 0h30v28H0ZM0 8h30M9 8v20M14 14h10M14 20h7"/></g><path d="M20 105H426" stroke="#223d52"/><path d="M20 105H426" stroke="#b5a2ff" stroke-opacity=".65" class="signal" style="animation-delay:-4s"/></g><g transform="translate(490 230)"><rect x="3" y="5" width="446" height="120" rx="12" fill="#02060b"/><rect width="446" height="120" rx="12" fill="url(#panel)" stroke="#29485c"/><path d="M15 1H431" stroke="#ffbc8a" opacity=".4"/><text x="20" y="27" fill="#ffbc8a" font-size="11" letter-spacing="1.6">04 / TESTS + DOCUMENTATION</text><text x="20" y="60" fill="#ecf7ff" font-size="18" font-weight="600">Explain behavior. Check assumptions.</text><text x="20" y="85" fill="#99b6ca" font-size="12">Tests and guides that support maintenance.</text><g transform="translate(395 18) scale(.75)" fill="none" stroke="#ffbc8a" stroke-width="1.5"><path d="M0 0h24v32H0ZM5 9l3 3 5-6M15 9h5M5 22l3 3 5-6M15 22h5"/></g><path d="M20 105H426" stroke="#223d52"/><path d="M20 105H426" stroke="#ffbc8a" stroke-opacity=".65" class="signal" style="animation-delay:-6s"/></g></g></svg>